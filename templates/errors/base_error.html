{% load static %}<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Something went wrong — FacultyNxtGen{% endblock %}</title>
  <meta name="robots" content="noindex,nofollow">
  <meta name="theme-color" content="#10264A">
  <link rel="icon" type="image/png" sizes="32x32" href="{% static 'images/favicon-32.png' %}">
  <link rel="stylesheet" href="{% static 'vendor/bootstrap/bootstrap.min.css' %}">
  <link rel="stylesheet" href="{% static 'vendor/bootstrap-icons/bootstrap-icons.min.css' %}">
  <link rel="stylesheet" href="{% static 'css/app.css' %}">
</head>
<body>
  <main id="main-content">
    <section class="section section--white" style="min-height:70vh;display:flex;align-items:center;">
      <div class="container">
        <div class="row justify-content-center">
          <div class="col-lg-7 text-center">
            <a href="/" class="d-inline-block mb-4">
              <img src="{% static 'images/facultynxtgen-logo.png' %}" alt="FacultyNxtGen" width="2017" height="605" style="max-width:230px;height:auto;">
            </a>
            <div class="empty-state__icon mx-auto"><i class="bi {% block icon %}bi-exclamation-triangle{% endblock %}" aria-hidden="true"></i></div>
            <p class="eyebrow mt-3">{% block code %}Error{% endblock %}</p>
            <h1 class="display-6 fw-bold">{% block heading %}Something went wrong{% endblock %}</h1>
            <p class="text-muted-fng mt-2 mb-4">{% block message %}We could not complete that request.{% endblock %}</p>
            <div class="d-flex flex-wrap justify-content-center gap-2">
              <a class="btn btn-brand" href="/">Go to homepage</a>
              <a class="btn btn-outline-brand" href="/jobs/">Browse jobs</a>
              <a class="btn btn-link" href="/contact/">Contact support</a>
            </div>
          </div>
        </div>
      </div>
    </section>
  </main>
</body>
</html>
